<div id="legendas" data-composition-id="legendas" data-width="1920" data-height="1080">
<div id="cap-s01-0" class="cap"><span>Nove de dezembro de mil oitocentos e</span></div>
<div id="cap-s01-1" class="cap"><span>trinta e cinco.</span></div>
<div id="cap-s01-2" class="cap"><span>Campinas, interior de São Paulo.</span></div>
<div id="cap-s01-3" class="cap"><span>Uma multidão se reúne no Largo de</span></div>
<div id="cap-s01-4" class="cap"><span>Santa Cruz.</span></div>
<div id="cap-s01-5" class="cap"><span>No centro, uma forca.</span></div>
<div id="cap-s01-6" class="cap"><span>E um homem que jurou,</span></div>
<div id="cap-s01-7" class="cap"><span>até o fim, ser inocente.</span></div>
<div id="cap-s01-8" class="cap"><span>O nome dele era Elesbão.</span></div>
<div id="cap-s01-9" class="cap"><span>E o que fizeram com o seu corpo,</span></div>
<div id="cap-s01-10" class="cap"><span>depois da morte, foi pensado para ser visto.</span></div>
<div id="cap-s01-11" class="cap"><span>Por todos.</span></div>
<div id="cap-s01-12" class="cap"><span>Principalmente, pelos escravizados.</span></div>
<div id="cap-s02-0" class="cap"><span>Neste mês da Consciência Negra,</span></div>
<div id="cap-s02-1" class="cap"><span>esta é uma história que o Brasil</span></div>
<div id="cap-s02-2" class="cap"><span>tentou esquecer.</span></div>
<div id="cap-s02-3" class="cap"><span>Mas, para entender Elesbão, precisamos voltar no tempo.</span></div>
<div id="cap-s02-4" class="cap"><span>E atravessar um oceano.</span></div>
<div id="cap-s03-0" class="cap"><span>Os documentos o descrevem como um africano</span></div>
<div id="cap-s03-1" class="cap"><span>de nação cabinda.</span></div>
<div id="cap-s03-2" class="cap"><span>Cabinda era um porto da costa da</span></div>
<div id="cap-s03-3" class="cap"><span>África Central, ao norte do rio Congo,</span></div>
<div id="cap-s03-4" class="cap"><span>terra de povos de língua quicongo.</span></div>
<div id="cap-s03-5" class="cap"><span>Por ali passaram milhares de pessoas capturadas</span></div>
<div id="cap-s03-6" class="cap"><span>e vendidas ao tráfico atlântico.</span></div>
<div id="cap-s03-7" class="cap"><span>Cabinda não era o nome do povo dele.</span></div>
<div id="cap-s03-8" class="cap"><span>Era o nome do porto onde foi embarcado.</span></div>
<div id="cap-s03-9" class="cap"><span>Até a identidade era dada pelo comércio.</span></div>
<div id="cap-s04-0" class="cap"><span>A travessia durava semanas.</span></div>
<div id="cap-s04-1" class="cap"><span>Nos porões, homens, mulheres e crianças eram amontoados,</span></div>
<div id="cap-s04-2" class="cap"><span>acorrentados, com pouca água e pouca comida.</span></div>
<div id="cap-s04-3" class="cap"><span>Muitos morriam no caminho.</span></div>
<div id="cap-s04-4" class="cap"><span>Os que sobreviviam chegavam ao país que</span></div>
<div id="cap-s04-5" class="cap"><span>mais recebeu africanos escravizados em todas as Américas.</span></div>
<div id="cap-s04-6" class="cap"><span>Estima-se que cerca de quatro milhões e</span></div>
<div id="cap-s04-7" class="cap"><span>oitocentas mil pessoas desembarcaram no Brasil,</span></div>
<div id="cap-s04-8" class="cap"><span>ao longo de mais de três séculos.</span></div>
<div id="cap-s05-0" class="cap"><span>Nos portos, eram vendidas como mercadoria.</span></div>
<div id="cap-s05-1" class="cap"><span>No Rio de Janeiro,</span></div>
<div id="cap-s05-2" class="cap"><span>o Cais do Valongo recebeu centenas de</span></div>
<div id="cap-s05-3" class="cap"><span>milhares de africanos.</span></div>
<div id="cap-s05-4" class="cap"><span>Hoje ele é Patrimônio Mundial da Unesco,</span></div>
<div id="cap-s05-5" class="cap"><span>justamente como memória dessa dor.</span></div>
<div id="cap-s06-0" class="cap"><span>Muitos seguiam para o interior.</span></div>
<div id="cap-s06-1" class="cap"><span>Campinas, no início do século dezenove,</span></div>
<div id="cap-s06-2" class="cap"><span>era terra de engenhos de açúcar.</span></div>
<div id="cap-s06-3" class="cap"><span>Depois, se tornaria um dos grandes centros</span></div>
<div id="cap-s06-4" class="cap"><span>do café.</span></div>
<div id="cap-s06-5" class="cap"><span>Uma riqueza inteira erguida sobre o trabalho</span></div>
<div id="cap-s06-6" class="cap"><span>forçado de pessoas escravizadas.</span></div>
<div id="cap-s07-0" class="cap"><span>Elesbão foi mantido cativo no engenho Romão,</span></div>
<div id="cap-s07-1" class="cap"><span>propriedade do capitão Luiz José de Oliveira.</span></div>
<div id="cap-s07-2" class="cap"><span>A rotina era a de qualquer engenho.</span></div>
<div id="cap-s07-3" class="cap"><span>Jornadas exaustivas.</span></div>
<div id="cap-s07-4" class="cap"><span>Castigos físicos.</span></div>
<div id="cap-s07-5" class="cap"><span>Vigilância constante.</span></div>
<div id="cap-s07-6" class="cap"><span>Mas havia uma pergunta que todo escravizado carregava.</span></div>
<div id="cap-s07-7" class="cap"><span>E se eu fugir?</span></div>
<div id="cap-s08-0" class="cap"><span>Elesbão fugiu.</span></div>
<div id="cap-s08-1" class="cap"><span>Segundo o inquérito de onze de agosto</span></div>
<div id="cap-s08-2" class="cap"><span>de mil oitocentos e trinta e um,</span></div>
<div id="cap-s08-3" class="cap"><span>ele vivia num quilombo formado por escravizados</span></div>
<div id="cap-s08-4" class="cap"><span>fugidos do próprio engenho Romão.</span></div>
<div id="cap-s08-5" class="cap"><span>Quilombos eram comunidades de resistência.</span></div>
<div id="cap-s08-6" class="cap"><span>Do pequeno grupo escondido na mata ao</span></div>
<div id="cap-s08-7" class="cap"><span>imenso Palmares, de Zumbi, eles provavam uma coisa.</span></div>
<div id="cap-s08-8" class="cap"><span>A escravidão nunca foi aceita em silêncio.</span></div>
<div id="cap-s09-0" class="cap"><span>Então veio o dia vinte de maio</span></div>
<div id="cap-s09-1" class="cap"><span>de mil oitocentos e trinta e um.</span></div>
<div id="cap-s09-2" class="cap"><span>À beira de um córrego,</span></div>
<div id="cap-s09-3" class="cap"><span>o capitão Luiz José de Oliveira foi morto.</span></div>
<div id="cap-s09-4" class="cap"><span>As autoridades apontaram dois culpados.</span></div>
<div id="cap-s09-5" class="cap"><span>Elesbão e outro escravizado, chamado Narciso.</span></div>
<div id="cap-s09-6" class="cap"><span>Elesbão afirmou ser inocente.</span></div>
<div id="cap-s09-7" class="cap"><span>Mas, para a justiça da época,</span></div>
<div id="cap-s09-8" class="cap"><span>a palavra de um africano escravizado e</span></div>
<div id="cap-s09-9" class="cap"><span>fugitivo valia muito pouco.</span></div>
<div id="cap-s10-0" class="cap"><span>Repare no ano.</span></div>
<div id="cap-s10-1" class="cap"><span>Naquele mesmo mil oitocentos e trinta e um,</span></div>
<div id="cap-s10-2" class="cap"><span>o Brasil aprovou uma lei que proibia</span></div>
<div id="cap-s10-3" class="cap"><span>o tráfico de africanos.</span></div>
<div id="cap-s10-4" class="cap"><span>Ela ficou conhecida como a lei para</span></div>
<div id="cap-s10-5" class="cap"><span>inglês ver.</span></div>
<div id="cap-s10-6" class="cap"><span>O tráfico continuou, ilegal, por quase vinte anos.</span></div>
<div id="cap-s10-7" class="cap"><span>A lei não protegia os africanos.</span></div>
<div id="cap-s10-8" class="cap"><span>Mas o rigor contra um escravizado acusado</span></div>
<div id="cap-s10-9" class="cap"><span>de matar o seu senhor, esse funcionava.</span></div>
<div id="cap-s11-0" class="cap"><span>A pedido da Câmara de Vereadores de Campinas,</span></div>
<div id="cap-s11-1" class="cap"><span>Elesbão e Narciso foram julgados e condenados</span></div>
<div id="cap-s11-2" class="cap"><span>à morte.</span></div>
<div id="cap-s11-3" class="cap"><span>Narciso foi executado em São Paulo,</span></div>
<div id="cap-s11-4" class="cap"><span>em vinte e quatro de maio de</span></div>
<div id="cap-s11-5" class="cap"><span>mil oitocentos e trinta e três.</span></div>
<div id="cap-s11-6" class="cap"><span>Elesbão ainda esperaria mais dois anos.</span></div>
<div id="cap-s12-0" class="cap"><span>Em mil oitocentos e trinta e cinco,</span></div>
<div id="cap-s12-1" class="cap"><span>o medo dos senhores cresceu.</span></div>
<div id="cap-s12-2" class="cap"><span>Em janeiro, em Salvador,</span></div>
<div id="cap-s12-3" class="cap"><span>africanos muçulmanos lideraram a Revolta dos Malês.</span></div>
<div id="cap-s12-4" class="cap"><span>Meses depois, uma nova lei passou a</span></div>
<div id="cap-s12-5" class="cap"><span>prever a pena de morte para escravizados</span></div>
<div id="cap-s12-6" class="cap"><span>que matassem ou ferissem seus senhores.</span></div>
<div id="cap-s12-7" class="cap"><span>O recado do Império era claro.</span></div>
<div id="cap-s12-8" class="cap"><span>Resistir podia custar a vida.</span></div>
<div id="cap-s13-0" class="cap"><span>Nove de dezembro de mil oitocentos e</span></div>
<div id="cap-s13-1" class="cap"><span>trinta e cinco.</span></div>
<div id="cap-s13-2" class="cap"><span>Da Cadeia Velha, onde hoje fica a</span></div>
<div id="cap-s13-3" class="cap"><span>Praça Bento Quirino, sai um cortejo.</span></div>
<div id="cap-s13-4" class="cap"><span>As autoridades.</span></div>
<div id="cap-s13-5" class="cap"><span>O vigário.</span></div>
<div id="cap-s13-6" class="cap"><span>O sacristão.</span></div>
<div id="cap-s13-7" class="cap"><span>O carrasco.</span></div>
<div id="cap-s13-8" class="cap"><span>A infantaria da Guarda Nacional.</span></div>
<div id="cap-s13-9" class="cap"><span>Os soldados da cavalaria.</span></div>
<div id="cap-s13-10" class="cap"><span>E, no meio deles, Elesbão.</span></div>
<div id="cap-s13-11" class="cap"><span>A população acompanha.</span></div>
<div id="cap-s13-12" class="cap"><span>E vários senhores mandam seus escravizados assistirem.</span></div>
<div id="cap-s13-13" class="cap"><span>Não por acaso.</span></div>
<div id="cap-s14-0" class="cap"><span>No Largo de Santa Cruz, Elesbão foi enforcado.</span></div>
<div id="cap-s14-1" class="cap"><span>Mas o juiz quis mais.</span></div>
<div id="cap-s14-2" class="cap"><span>Acrescentou à sentença:</span></div>
<div id="cap-s14-3" class="cap"><span>depois da morte, cortar-se-ão as mãos e</span></div>
<div id="cap-s14-4" class="cap"><span>a cabeça.</span></div>
<div id="cap-s14-5" class="cap"><span>A cabeça seria levada para a Vila</span></div>
<div id="cap-s14-6" class="cap"><span>de Jundiaí e colocada num poste,</span></div>
<div id="cap-s14-7" class="cap"><span>em lugar público.</span></div>
<div id="cap-s14-8" class="cap"><span>As mãos ficariam expostas em Campinas.</span></div>
<div id="cap-s14-9" class="cap"><span>O corpo de um homem, transformado em aviso.</span></div>
<div id="cap-s15-0" class="cap"><span>Esse era o objetivo.</span></div>
<div id="cap-s15-1" class="cap"><span>O medo.</span></div>
<div id="cap-s15-2" class="cap"><span>Um alerta aos quilombolas e a quem</span></div>
<div id="cap-s15-3" class="cap"><span>ajudasse escravizados a conquistar a liberdade.</span></div>
<div id="cap-s15-4" class="cap"><span>A escravidão não se sustentava apenas com correntes.</span></div>
<div id="cap-s15-5" class="cap"><span>Ela se sustentava com o espetáculo da violência.</span></div>
<div id="cap-s15-6" class="cap"><span>O tronco.</span></div>
<div id="cap-s15-7" class="cap"><span>O chicote.</span></div>
<div id="cap-s15-8" class="cap"><span>O pelourinho.</span></div>
<div id="cap-s15-9" class="cap"><span>A forca.</span></div>
<div id="cap-s16-0" class="cap"><span>Mas o medo não venceu.</span></div>
<div id="cap-s16-1" class="cap"><span>As fugas continuaram.</span></div>
<div id="cap-s16-2" class="cap"><span>Os quilombos continuaram.</span></div>
<div id="cap-s16-3" class="cap"><span>Vieram revoltas, alforrias compradas com anos de economia,</span></div>
<div id="cap-s16-4" class="cap"><span>irmandades negras, e abolicionistas negros como Luiz Gama,</span></div>
<div id="cap-s16-5" class="cap"><span>que libertou centenas de pessoas nos tribunais.</span></div>
<div id="cap-s16-6" class="cap"><span>A liberdade foi arrancada, passo a passo,</span></div>
<div id="cap-s16-7" class="cap"><span>por quem a escravidão tentou calar.</span></div>
<div id="cap-s17-0" class="cap"><span>Só em treze de maio de mil</span></div>
<div id="cap-s17-1" class="cap"><span>oitocentos e oitenta e oito o Brasil</span></div>
<div id="cap-s17-2" class="cap"><span>aboliu a escravidão.</span></div>
<div id="cap-s17-3" class="cap"><span>Foi o último país das Américas a</span></div>
<div id="cap-s17-4" class="cap"><span>fazer isso.</span></div>
<div id="cap-s17-5" class="cap"><span>E não houve terra, nem indenização,</span></div>
<div id="cap-s17-6" class="cap"><span>nem reparação para os libertos.</span></div>
<div id="cap-s17-7" class="cap"><span>O racismo que sustentava o sistema não</span></div>
<div id="cap-s17-8" class="cap"><span>acabou com uma assinatura.</span></div>
<div id="cap-s18-0" class="cap"><span>Hoje, Elesbão é um símbolo de resistência</span></div>
<div id="cap-s18-1" class="cap"><span>na luta por igualdade e justiça.</span></div>
<div id="cap-s18-2" class="cap"><span>Em Campinas, cortejos musicais lembraram o seu nome:</span></div>
<div id="cap-s18-3" class="cap"><span>O Auto do Escravizado Elesbão,</span></div>
<div id="cap-s18-4" class="cap"><span>o Extermínio da Juventude Negra.</span></div>
<div id="cap-s18-5" class="cap"><span>Sua história virou livro, de Valdir Oliveira,</span></div>
<div id="cap-s18-6" class="cap"><span>e peça de teatro, Elesbão,</span></div>
<div id="cap-s18-7" class="cap"><span>um sonho de liberdade, adaptada por Roberto Boni.</span></div>
<div id="cap-s19-0" class="cap"><span>O nome daquele cortejo não é por acaso.</span></div>
<div id="cap-s19-1" class="cap"><span>A cabeça de Elesbão foi exposta como</span></div>
<div id="cap-s19-2" class="cap"><span>ameaça a outros homens negros.</span></div>
<div id="cap-s19-3" class="cap"><span>Quase dois séculos depois, a pergunta continua aberta.</span></div>
<div id="cap-s19-4" class="cap"><span>O que mudou?</span></div>
<div id="cap-s19-5" class="cap"><span>E o que ainda não mudou?</span></div>
<div id="cap-s19-6" class="cap"><span>Lembrar Elesbão é lembrar milhões de pessoas</span></div>
<div id="cap-s19-7" class="cap"><span>cujos nomes nem chegaram até nós.</span></div>
<div id="cap-s19-8" class="cap"><span>Neste mês da Consciência Negra,</span></div>
<div id="cap-s19-9" class="cap"><span>diga o nome dele.</span></div>
<div id="cap-s19-10" class="cap"><span>Elesbão.</span></div>
</div>
