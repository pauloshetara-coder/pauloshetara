<div id="cap-c03-5" class="cap"><span>Para comemorar, Tito ofereceu ao povo cem</span></div>

<div id="cap-c04-0" class="cap"><span>Ainda está escuro, e Roma já está acordada.</span></div>
<div id="cap-c04-1" class="cap"><span>Pelas ruas, uma multidão caminha em direção</span></div>

<div id="cap-c04-5" class="cap"><span>Soldados.</span></div>

<div id="cap-c05-1" class="cap"><span>A arquibancada é um mapa da sociedade romana.</span></div>

<div id="cap-c20-0" class="cap"><span>Os combates de gladiadores acabaram no século cinco,</span></div>

<div id="cap-c20-2" class="cap"><span>Em mil setecentos e quarenta e nove,</span></div>

<div id="cap-c20-4" class="cap"><span>memória dos mártires cristãos.</span></div>

<div id="cap-c21-0" class="cap"><span>Hoje, o Coliseu é o símbolo de</span></div>

<div id="cap-c21-5" class="cap"><span>Mas, quando você pisar ali, lembre-se.</span></div>
<div id="cap-c21-6" class="cap"><span>Cada pedra daquele lugar ouviu o rugido</span></div>

<div id="cap-c21-8" class="cap"><span>E o silêncio de quem nunca voltou</span></div>
<div id="cap-c21-9" class="cap"><span>da arena.</span></div>
