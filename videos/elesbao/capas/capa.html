<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:PF;src:url(fonts/PlayfairDisplay-Black.ttf)}
@font-face{font-family:In;src:url(fonts/Inter.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:var(--w);height:var(--h);overflow:hidden;background:#0b0907}
.bg{position:absolute;inset:0;background:url(../assets/img/IMG) var(--pos)/cover no-repeat;filter:sepia(.35) contrast(1.15) brightness(.8)}
.sh{position:absolute;inset:0;background:var(--grad)}
.txt{position:absolute;left:var(--pad);right:var(--pad);bottom:var(--bot);color:#fff}
.tag{display:inline-block;font-family:Anton;font-size:calc(var(--u)*3.2);letter-spacing:.06em;background:#b8322a;color:#fff;padding:.12em .45em;margin-bottom:.35em}
h1{font-family:Anton;font-size:calc(var(--u)*15);line-height:.9;letter-spacing:.01em;color:#f5c542;text-shadow:0 .06em 0 #000,0 0 .4em rgba(0,0,0,.7)}
h2{font-family:Anton;font-size:calc(var(--u)*5.4);line-height:1.02;color:#fff;text-shadow:0 .06em .2em #000;margin-top:.15em;text-transform:uppercase}
p{font-family:In;font-weight:700;font-size:calc(var(--u)*2.3);letter-spacing:.2em;color:#e8dcc3;margin-top:.9em;text-transform:uppercase}
</style></head><body>
<div class="bg"></div><div class="sh"></div>
<div class="txt"><span class="tag">CONSCIÊNCIA NEGRA</span><h1>ELESBÃO</h1><h2>ENFORCADO PARA<br>SERVIR DE AVISO</h2><p>Campinas · 1835 · uma história real</p></div>
</body></html>
