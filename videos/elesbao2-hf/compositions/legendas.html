<div id="cap-a01-0" class="cap"><span>No vídeo anterior, você conheceu Elesbão,</span></div>

<div id="cap-a01-3" class="cap"><span>Hoje, a viagem é outra.</span></div>
<div id="cap-a01-4" class="cap"><span>Mais de mil e trezentos anos antes,</span></div>
<div id="cap-a01-5" class="cap"><span>do outro lado do oceano,</span></div>

<div id="cap-a01-7" class="cap"><span>coroa de ouro.</span></div>
<div id="cap-a01-8" class="cap"><span>Ele foi rei.</span></div>
<div id="cap-a01-9" class="cap"><span>Comandou exércitos.</span></div>
<div id="cap-a01-10" class="cap"><span>Atravessou o mar para salvar um povo.</span></div>
<div id="cap-a01-11" class="cap"><span>E, no fim da vida,</span></div>
<div id="cap-a01-12" class="cap"><span>fez o que quase nenhum rei faz.</span></div>
<div id="cap-a01-13" class="cap"><span>Abriu mão de tudo.</span></div>
<div id="cap-a02-0" class="cap"><span>Esta é a história de Santo Elesbão,</span></div>
<div id="cap-a02-1" class="cap"><span>o rei africano de Axum.</span></div>
<div id="cap-a02-2" class="cap"><span>A segunda história de dois negros chamados Elesbão.</span></div>
<div id="cap-a03-0" class="cap"><span>Para entender quem ele foi,</span></div>
<div id="cap-a03-1" class="cap"><span>precisamos ir até o norte da atual Etiópia,</span></div>
<div id="cap-a03-2" class="cap"><span>onde hoje fica também a Eritreia.</span></div>
<div id="cap-a03-3" class="cap"><span>Ali, nas terras altas,</span></div>
<div id="cap-a03-4" class="cap"><span>existiu um dos reinos mais poderosos da Antiguidade:</span></div>
<div id="cap-a03-5" class="cap"><span>o Reino de Axum.</span></div>
<div id="cap-a03-6" class="cap"><span>Pelo seu porto, Adúlis, no Mar Vermelho,</span></div>
<div id="cap-a03-7" class="cap"><span>passavam marfim, ouro, incenso e especiarias,</span></div>
<div id="cap-a03-8" class="cap"><span>entre o Império Romano,</span></div>
<div id="cap-a03-9" class="cap"><span>a Arábia e a Índia.</span></div>
<div id="cap-a04-0" class="cap"><span>Axum era tão rico que cunhava as</span></div>
<div id="cap-a04-1" class="cap"><span>próprias moedas, de ouro, prata e bronze.</span></div>
<div id="cap-a04-2" class="cap"><span>Pouquíssimos reinos do mundo antigo faziam isso.</span></div>
<div id="cap-a04-3" class="cap"><span>No século terceiro, o profeta persa Mani</span></div>
<div id="cap-a04-4" class="cap"><span>escreveu que havia quatro grandes reinos na Terra:</span></div>
<div id="cap-a04-5" class="cap"><span>Roma, a Pérsia, a China.</span></div>
<div id="cap-a04-6" class="cap"><span>E Axum.</span></div>
<div id="cap-a05-0" class="cap"><span>Os reis de Axum deixaram marcas que</span></div>
<div id="cap-a05-1" class="cap"><span>ainda estão de pé.</span></div>
<div id="cap-a05-2" class="cap"><span>São as estelas, enormes monumentos de pedra,</span></div>
<div id="cap-a05-3" class="cap"><span>esculpidos num único bloco,</span></div>
<div id="cap-a05-4" class="cap"><span>alguns com mais de vinte metros de altura.</span></div>
<div id="cap-a05-5" class="cap"><span>A maior delas, com trinta e três metros,</span></div>

<div id="cap-a05-7" class="cap"><span>quebrada no chão.</span></div>
<div id="cap-a05-8" class="cap"><span>Uma outra foi levada para Roma pelas</span></div>
<div id="cap-a05-9" class="cap"><span>tropas de Mussolini, em mil novecentos e</span></div>
<div id="cap-a05-10" class="cap"><span>trinta e sete.</span></div>
<div id="cap-a05-11" class="cap"><span>Só voltou para casa em dois mil</span></div>
<div id="cap-a05-12" class="cap"><span>e cinco.</span></div>
<div id="cap-a06-0" class="cap"><span>E tem mais.</span></div>
<div id="cap-a06-1" class="cap"><span>Por volta do ano trezentos e trinta,</span></div>
<div id="cap-a06-2" class="cap"><span>o rei Ezana se tornou cristão.</span></div>
<div id="cap-a06-3" class="cap"><span>Axum foi um dos primeiros reinos do</span></div>
<div id="cap-a06-4" class="cap"><span>mundo a adotar o cristianismo,</span></div>
<div id="cap-a06-5" class="cap"><span>antes de grande parte da Europa.</span></div>
<div id="cap-a06-6" class="cap"><span>Nas moedas, os antigos símbolos do sol</span></div>
<div id="cap-a06-7" class="cap"><span>e da lua deram lugar à cruz.</span></div>
<div id="cap-a06-8" class="cap"><span>A Igreja da Etiópia nasceu ali,</span></div>
<div id="cap-a06-9" class="cap"><span>e existe até hoje,</span></div>
<div id="cap-a06-10" class="cap"><span>com a sua própria língua sagrada, o gueez.</span></div>
<div id="cap-a07-0" class="cap"><span>Quase duzentos anos depois,</span></div>
<div id="cap-a07-1" class="cap"><span>por volta do ano quinhentos e vinte,</span></div>
<div id="cap-a07-2" class="cap"><span>sobe ao trono um rei chamado Kaleb.</span></div>
<div id="cap-a07-3" class="cap"><span>Como todo rei de Axum,</span></div>
<div id="cap-a07-4" class="cap"><span>ele tinha também um nome de trono:</span></div>
<div id="cap-a07-5" class="cap"><span>Ella Asbeha.</span></div>
<div id="cap-a07-6" class="cap"><span>Os gregos escreveram Elesbaas.</span></div>
<div id="cap-a07-7" class="cap"><span>Os latinos, Elesbaan.</span></div>
<div id="cap-a07-8" class="cap"><span>E, séculos depois, em português,</span></div>
<div id="cap-a07-9" class="cap"><span>esse nome virou Elesbão.</span></div>
<div id="cap-a08-0" class="cap"><span>Do outro lado do Mar Vermelho,</span></div>
<div id="cap-a08-1" class="cap"><span>no atual Iêmen, ficava o reino de Himiar.</span></div>
<div id="cap-a08-2" class="cap"><span>Ali, um rei chamado Yusuf,</span></div>
<div id="cap-a08-3" class="cap"><span>conhecido como Dhu Nuwas, perseguiu os cristãos.</span></div>
<div id="cap-a08-4" class="cap"><span>Por volta do ano quinhentos e vinte</span></div>
<div id="cap-a08-5" class="cap"><span>e três, na cidade de Najran,</span></div>
<div id="cap-a08-6" class="cap"><span>centenas de cristãos foram mortos, homens,</span></div>
<div id="cap-a08-7" class="cap"><span>mulheres e crianças, por se recusarem a</span></div>

<div id="cap-a08-9" class="cap"><span>As notícias atravessaram o mar.</span></div>
<div id="cap-a08-10" class="cap"><span>E chegaram a Axum.</span></div>

<div id="cap-a09-4" class="cap"><span>Elesbão tinha uma escolha:</span></div>
<div id="cap-a09-5" class="cap"><span>ficar seguro no seu reino ou atravessar</span></div>

<div id="cap-a10-0" class="cap"><span>Ele escolheu atravessar.</span></div>
<div id="cap-a10-1" class="cap"><span>Por volta do ano quinhentos e vinte</span></div>
<div id="cap-a10-2" class="cap"><span>e cinco, uma frota partiu de Adúlis,</span></div>
<div id="cap-a10-3" class="cap"><span>levando milhares de soldados africanos para a Arábia.</span></div>
<div id="cap-a10-4" class="cap"><span>Na batalha, o exército de Axum venceu.</span></div>
<div id="cap-a10-5" class="cap"><span>Dhu Nuwas foi derrotado,</span></div>
<div id="cap-a10-6" class="cap"><span>e a tradição conta que ele avançou</span></div>
<div id="cap-a10-7" class="cap"><span>com o seu cavalo para dentro do</span></div>
<div id="cap-a10-8" class="cap"><span>mar e desapareceu nas ondas.</span></div>
<div id="cap-a10-9" class="cap"><span>Himiar passou para o controle de Axum.</span></div>
<div id="cap-a11-0" class="cap"><span>E se você gosta de histórias como esta,</span></div>
<div id="cap-a11-1" class="cap"><span>que quase ninguém conta,</span></div>
<div id="cap-a11-2" class="cap"><span>os trinta e sete mini e-books do</span></div>
<div id="cap-a11-3" class="cap"><span>canal estão no link da descrição.</span></div>
<div id="cap-a11-4" class="cap"><span>Agora, voltemos a Elesbão.</span></div>
<div id="cap-a12-0" class="cap"><span>Naquele momento, Elesbão era um dos homens</span></div>
<div id="cap-a12-1" class="cap"><span>mais poderosos do mundo.</span></div>
<div id="cap-a12-2" class="cap"><span>O historiador bizantino Procópio escreveu sobre ele,</span></div>
<div id="cap-a12-3" class="cap"><span>chamando-o de Helestheaios, rei dos etíopes.</span></div>
<div id="cap-a12-4" class="cap"><span>O imperador de Constantinopla o tratava como aliado.</span></div>
<div id="cap-a12-5" class="cap"><span>O seu reino dominava as duas margens</span></div>
<div id="cap-a12-6" class="cap"><span>do Mar Vermelho.</span></div>
<div id="cap-a13-0" class="cap"><span>E foi justamente no auge que ele</span></div>
<div id="cap-a13-1" class="cap"><span>fez o inesperado.</span></div>
<div id="cap-a13-2" class="cap"><span>Segundo a tradição, Elesbão tirou a sua</span></div>
<div id="cap-a13-3" class="cap"><span>coroa e a enviou para Jerusalém,</span></div>
<div id="cap-a13-4" class="cap"><span>para ser pendurada na Igreja do Santo Sepulcro,</span></div>
<div id="cap-a13-5" class="cap"><span>o lugar onde, para os cristãos,</span></div>
<div id="cap-a13-6" class="cap"><span>Jesus foi sepultado.</span></div>
<div id="cap-a13-7" class="cap"><span>Um rei vitorioso entregava a coroa.</span></div>
<div id="cap-a13-8" class="cap"><span>Por vontade própria.</span></div>
<div id="cap-a14-0" class="cap"><span>Depois, deixou o palácio.</span></div>
<div id="cap-a14-1" class="cap"><span>Subiu uma colina perto de Axum,</span></div>
<div id="cap-a14-2" class="cap"><span>até o mosteiro de Abba Pentalewon,</span></div>
<div id="cap-a14-3" class="cap"><span>e ali passou a viver como monge,</span></div>
<div id="cap-a14-4" class="cap"><span>numa cela pequena, em oração, comendo pouco,</span></div>
<div id="cap-a14-5" class="cap"><span>sem servos e sem trono.</span></div>
<div id="cap-a14-6" class="cap"><span>O homem que comandou exércitos terminou a</span></div>
<div id="cap-a14-7" class="cap"><span>vida em silêncio.</span></div>
<div id="cap-a15-0" class="cap"><span>Em Axum, ainda hoje,</span></div>

<div id="cap-a15-2" class="cap"><span>Kaleb e ao seu filho, Gebre Meskel.</span></div>
<div id="cap-a15-3" class="cap"><span>A Igreja da Etiópia o venera como santo.</span></div>
<div id="cap-a15-4" class="cap"><span>E a Igreja Católica também:</span></div>
<div id="cap-a15-5" class="cap"><span>no calendário romano, Santo Elesbão é lembrado</span></div>
<div id="cap-a15-6" class="cap"><span>no dia vinte e sete de outubro.</span></div>
<div id="cap-a16-0" class="cap"><span>Mas como um rei etíope do século</span></div>
<div id="cap-a16-1" class="cap"><span>sexto chegou ao Brasil?</span></div>
<div id="cap-a16-2" class="cap"><span>A resposta passa por Portugal.</span></div>
<div id="cap-a16-3" class="cap"><span>No século dezoito, os frades carmelitas espalharam</span></div>

<div id="cap-a16-5" class="cap"><span>Santo Elesbão e Santa Efigênia.</span></div>
<div id="cap-a16-6" class="cap"><span>Em mil setecentos e trinta e cinco,</span></div>
<div id="cap-a16-7" class="cap"><span>o frei José Pereira de Santana publicou</span></div>
<div id="cap-a16-8" class="cap"><span>em Lisboa a obra Os Dois Atlantes</span></div>
<div id="cap-a16-9" class="cap"><span>da Etiópia, contando a vida dos dois.</span></div>
<div id="cap-a17-0" class="cap"><span>No Brasil, africanos e seus descendentes,</span></div>
<div id="cap-a17-1" class="cap"><span>escravizados e libertos, abraçaram esses santos.</span></div>
<div id="cap-a17-2" class="cap"><span>Eles tinham a sua cor.</span></div>
<div id="cap-a17-3" class="cap"><span>Formaram irmandades, juntaram dinheiro, ajudaram doentes,</span></div>
<div id="cap-a17-4" class="cap"><span>enterraram os seus mortos com dignidade e,</span></div>
<div id="cap-a17-5" class="cap"><span>muitas vezes, compraram a liberdade de irmãos.</span></div>
<div id="cap-a17-6" class="cap"><span>No Rio de Janeiro,</span></div>
<div id="cap-a17-7" class="cap"><span>a Irmandade de Santo Elesbão e Santa</span></div>
<div id="cap-a17-8" class="cap"><span>Efigênia ergueu a sua própria igreja,</span></div>
<div id="cap-a17-9" class="cap"><span>inaugurada em mil setecentos e cinquenta e quatro.</span></div>
<div id="cap-a17-10" class="cap"><span>Ela está de pé até hoje.</span></div>
<div id="cap-a18-0" class="cap"><span>Nas imagens, Elesbão aparece como um rei negro,</span></div>
<div id="cap-a18-1" class="cap"><span>de coroa e manto,</span></div>
<div id="cap-a18-2" class="cap"><span>com o hábito dos carmelitas.</span></div>
<div id="cap-a18-3" class="cap"><span>Em Salvador, na Igreja do Rosário dos Pretos,</span></div>
<div id="cap-a18-4" class="cap"><span>a sua imagem continua no altar.</span></div>
<div id="cap-a18-5" class="cap"><span>Para quem vivia na escravidão,</span></div>
<div id="cap-a18-6" class="cap"><span>ver um rei africano no altar dizia</span></div>
<div id="cap-a18-7" class="cap"><span>uma coisa poderosa:</span></div>
<div id="cap-a18-8" class="cap"><span>a África teve reis.</span></div>
<div id="cap-a18-9" class="cap"><span>E teve santos.</span></div>
<div id="cap-a19-0" class="cap"><span>Os africanos escravizados recebiam, no batismo,</span></div>
<div id="cap-a19-1" class="cap"><span>um nome cristão.</span></div>
<div id="cap-a19-2" class="cap"><span>Muitos ganharam nomes de santos negros:</span></div>
<div id="cap-a19-3" class="cap"><span>Benedito, Efigênia, Antônio.</span></div>
<div id="cap-a19-4" class="cap"><span>E Elesbão.</span></div>
<div id="cap-a19-5" class="cap"><span>Não sabemos quem deu o nome ao</span></div>
<div id="cap-a19-6" class="cap"><span>Elesbão de Campinas, nem por quê.</span></div>
<div id="cap-a19-7" class="cap"><span>Mas é muito provável que ele carregasse,</span></div>
<div id="cap-a19-8" class="cap"><span>sem saber ou sabendo,</span></div>
<div id="cap-a19-9" class="cap"><span>o nome de um rei africano.</span></div>
<div id="cap-a20-0" class="cap"><span>Dois homens negros.</span></div>
<div id="cap-a20-1" class="cap"><span>O mesmo nome.</span></div>
<div id="cap-a20-2" class="cap"><span>Um usou uma coroa de ouro e</span></div>
<div id="cap-a20-3" class="cap"><span>a entregou por vontade própria.</span></div>
<div id="cap-a20-4" class="cap"><span>O outro teve a cabeça exposta num</span></div>
<div id="cap-a20-5" class="cap"><span>poste, como aviso.</span></div>
<div id="cap-a20-6" class="cap"><span>Entre eles, mais de mil e trezentos anos,</span></div>
<div id="cap-a20-7" class="cap"><span>um oceano e a escravidão.</span></div>
<div id="cap-a20-8" class="cap"><span>Lembrar os dois é lembrar que a</span></div>
<div id="cap-a20-9" class="cap"><span>história do povo negro não começa nas correntes.</span></div>
<div id="cap-a20-10" class="cap"><span>Ela começa em reinos como Axum.</span></div>
<div id="cap-a21-0" class="cap"><span>Se essa história tocou você, inscreva-se no canal,</span></div>
<div id="cap-a21-1" class="cap"><span>ative o sininho e deixe o seu like.</span></div>
<div id="cap-a21-2" class="cap"><span>E me conte nos comentários:</span></div>
<div id="cap-a21-3" class="cap"><span>você já conhecia Santo Elesbão?</span></div>
<div id="cap-a21-4" class="cap"><span>E se quiser ir ainda mais fundo,</span></div>
