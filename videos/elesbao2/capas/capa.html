<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:In;src:url(fonts/Inter.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:var(--w);height:var(--h);overflow:hidden;background:#0b0907;position:relative}
.bg{position:absolute;inset:0;background:url(../../elesbao2-hf/assets/img/aksum_estelas2.jpg) center/cover no-repeat;filter:sepia(.45) contrast(1.15) brightness(.62)}
.sh{position:absolute;inset:0;background:var(--grad)}
.santo{position:absolute;border:calc(var(--u)*.6) solid #f5c542;box-shadow:0 0 calc(var(--u)*4) #000;background:url(../../elesbao2-hf/assets/img/santo_elesbao2.jpg) 50% 22%/cover no-repeat;right:var(--sr);top:var(--st);width:var(--sw);height:var(--sh)}
.txt{position:absolute;left:var(--pad);right:var(--tr);bottom:var(--bot);color:#fff}
.tag{display:inline-block;font-family:Anton;font-size:calc(var(--u)*3.2);letter-spacing:.06em;background:#b8322a;color:#fff;padding:.12em .45em;margin-bottom:.35em}
h2.pre{margin-bottom:.32em;font-size:calc(var(--u)*4.4);color:#e8dcc3}
h1{font-family:Anton;font-size:calc(var(--u)*15);line-height:.9;color:#f5c542;text-shadow:0 .06em 0 #000,0 0 .4em rgba(0,0,0,.7)}
h2{font-family:Anton;font-size:calc(var(--u)*5.6);line-height:1.02;color:#fff;text-shadow:0 .06em .2em #000;margin-top:.15em;text-transform:uppercase}
p{font-family:In;font-weight:700;font-size:calc(var(--u)*2.3);letter-spacing:.2em;color:#e8dcc3;margin-top:.9em;text-transform:uppercase}
</style></head><body>
<div class="bg"></div><div class="sh"></div><div class="santo"></div>
<div class="txt"><span class="tag">CONSCIÊNCIA NEGRA</span><h2 class="pre">DOIS NEGROS CHAMADOS · PARTE 2</h2><h1>ELESBÃO</h1><h2>O REI AFRICANO<br>QUE VIROU SANTO</h2><p>Axum · século VI · uma história real</p></div>
</body></html>
